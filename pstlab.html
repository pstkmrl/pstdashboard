<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PST Lab — Equipment Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #121110;
    --panel:       #1b1a18;
    --panel-raised:#211f1c;
    --border:      #322e29;
    --ink:         #f3efe6;
    --ink-dim:     #9a948a;
    --ink-faint:   #635d54;

    --ready:       #ffb703;
    --ready-dim:   #3a2a0c;
    --repair:      #4fc3f7;
    --repair-dim:  #0f2b34;
    --notok:       #ff5c5c;
    --notok-dim:   #391414;
    --wait:        #9a948a;
    --wait-dim:    #211f1c;

    --radius: 10px;
  }

  body {
    background:
      radial-gradient(ellipse at top, #1a1815 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .lab-title { display: flex; align-items: center; gap: 14px; }
  .lab-icon {
    width: 38px; height: 38px;
    background: var(--ready);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 18px -2px rgba(255,183,3,0.55);
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-transform: uppercase;
  }
  h1 span { color: var(--ready); }
  .subtitle {
    font-size: 11px;
    color: var(--ink-dim);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 3px;
    letter-spacing: 0.04em;
  }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .last-sync {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    text-align: right;
  }
  .last-sync strong { color: var(--ink); display: block; font-size: 13px; }
  .refresh-btn {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .refresh-btn:hover { border-color: var(--ready); color: var(--ready); }
  .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Board ── */
  .board {
    padding: 24px 28px 40px;
    display: grid;
    grid-template-columns: repeat(4, minmax(260px, 1fr));
    gap: 16px;
    align-items: start;
  }

  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    min-height: 120px;
  }

  .col-head {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .col-head-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .col-label {
    font-family: 'Archivo Black', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .col-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
  }
  .col-glow {
    height: 3px;
    border-radius: 3px;
    margin-top: 12px;
  }
  .col-sub {
    font-size: 10px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .col-ready  .col-label, .col-ready  .col-count { color: var(--ready); }
  .col-ready  .col-glow  { background: var(--ready); box-shadow: 0 0 12px 0 rgba(255,183,3,0.6); }
  .col-repair .col-label, .col-repair .col-count { color: var(--repair); }
  .col-repair .col-glow  { background: var(--repair); box-shadow: 0 0 12px 0 rgba(79,195,247,0.5); }
  .col-notok  .col-label, .col-notok  .col-count { color: var(--notok); }
  .col-notok  .col-glow  { background: var(--notok); box-shadow: 0 0 12px 0 rgba(255,92,92,0.5); }
  .col-wait   .col-label, .col-wait   .col-count { color: var(--ink-dim); }
  .col-wait   .col-glow  { background: var(--border); }

  .ticket-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .col-empty {
    padding: 28px 12px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
    font-style: italic;
  }

  /* ── Ticket card ── */
  .ticket {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px 12px;
    position: relative;
    transition: transform 0.12s, border-color 0.12s;
  }
  .ticket:hover { transform: translateY(-1px); border-color: var(--ink-faint); }
  .ticket::before {
    content: "";
    position: absolute;
    top: -1px; left: 10px; right: 10px;
    height: 1px;
    background-image: linear-gradient(to right, var(--border) 60%, transparent 0%);
    background-size: 8px 1px;
    background-repeat: repeat-x;
  }

  .ticket-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .p-ready  { background: var(--ready);  box-shadow: 0 0 8px 1px rgba(255,183,3,0.7); animation: pulse 1.8s ease-in-out infinite; }
  .p-repair { background: var(--repair); }
  .p-notok  { background: var(--notok); }
  .p-wait   { background: var(--wait); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  .item-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
    flex: 1;
  }
  .labcode {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--ink-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .raw-status {
    font-size: 11px;
    color: var(--ink-faint);
    margin-left: 16px;
    margin-bottom: 2px;
  }

  .notice {
    margin-top: 9px;
    margin-left: 16px;
    font-size: 12px;
    color: var(--ink-dim);
    background: var(--bg);
    border-left: 2px solid var(--ink-faint);
    padding: 6px 9px;
    border-radius: 0 5px 5px 0;
    line-height: 1.4;
  }
  .notice strong {
    color: var(--ink);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 2px;
  }

  /* ── States ── */
  .state-loading, .state-error {
    text-align: center;
    padding: 90px 28px;
    color: var(--ink-dim);
    grid-column: 1 / -1;
  }
  .state-loading .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--ready);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 18px;
  }
  .state-error { color: var(--notok); }
  .state-error .err-icon { font-size: 34px; margin-bottom: 12px; }
  .state-error p { font-size: 13px; max-width: 420px; margin: 8px auto 0; color: var(--ink-dim); }
  .config-hint {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 8px;
    display: inline-block;
    text-align: left;
    color: var(--ink-dim);
  }
  .config-hint span { color: var(--ready); }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 14px 28px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  @media (max-width: 1050px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px) {
    header, .board, footer { padding-left: 16px; padding-right: 16px; }
    .board { grid-template-columns: 1fr; }
    .ticket-list { max-height: none; }
  }
</style>
</head>
<body>

<header>
  <div class="lab-title">
    <div class="lab-icon">🔧</div>
    <div>
      <h1>PST <span>LAB</span></h1>
      <div class="subtitle">Equipment Board</div>
    </div>
  </div>
  <div class="header-right">
    <div class="last-sync">
      <strong id="syncTime">—</strong>
      Last synced
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">
      <svg id="refreshIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
      </svg>
      Refresh
    </button>
  </div>
</header>

<div id="content">
  <div class="board"><div class="state-loading"><div class="spinner"></div>Connecting to lab sheet…</div></div>
</div>

<footer>
  <span id="footerCount">— items</span>
  <span>PST Lab · Repair Tracker</span>
</footer>

<script>
  // ── CONFIGURE THIS ──────────────────────────────────────────────
  // Paste your Apps Script Web App URL here after deployment
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3SsNFdzhUHHRlNSAJu3VF7XKu7tfD__pVHpCPeDuwrIoKBUfjaIayo5ThIJONTxIL/exec";
  // ────────────────────────────────────────────────────────────────

  let allItems = [];

  // Buckets, in board order — mirrors a kitchen "ready" display:
  // items move left (waiting) to right (ready to collect).
  const COLUMNS = [
    { key: "WAIT",   label: "Waiting",       sub: "No status set", cls: "col-wait",   pip: "p-wait",
      match: s => s === "" },
    { key: "REPAIR", label: "Under Repair",  sub: "Being worked on", cls: "col-repair", pip: "p-repair",
      match: s => s.includes("REPAIR") },
    { key: "NOTOK",  label: "Not OK",        sub: "Needs attention", cls: "col-notok",  pip: "p-notok",
      match: s => s.includes("NOT OK") },
    { key: "READY",  label: "Ready",         sub: "Ready to pick up", cls: "col-ready",  pip: "p-ready",
      match: s => s.includes("READY") },
  ];

  function normStatus(status) {
    return (status || "").toUpperCase().trim();
  }

  function bucketFor(status) {
    const s = normStatus(status);
    // Check specific buckets first; anything unrecognized falls back to Waiting.
    for (const col of COLUMNS) {
      if (col.key !== "WAIT" && col.match(s)) return col;
    }
    return COLUMNS[0];
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function renderTicket(item, col) {
    const rawStatus = normStatus(item.status);
    const showRaw = rawStatus && rawStatus !== col.label.toUpperCase();
    const labcode = item.labcode ? `<span class="labcode">${escHtml(item.labcode)}</span>` : "";
    const rawLine = showRaw ? `<div class="raw-status">${escHtml(item.status)}</div>` : "";
    const notice = item.notice ? `
      <div class="notice">
        <strong>Notice</strong>
        ${escHtml(item.notice)}
      </div>` : "";
    return `
      <div class="ticket">
        <div class="ticket-top">
          <span class="pip ${col.pip}"></span>
          <div class="item-name">${escHtml(item.item)}</div>
          ${labcode}
        </div>
        ${rawLine}
        ${notice}
      </div>`;
  }

  function renderBoard(items) {
    const grouped = {};
    COLUMNS.forEach(c => grouped[c.key] = []);
    items.forEach(item => grouped[bucketFor(item.status).key].push(item));

    const columnsHtml = COLUMNS.map(col => {
      const list = grouped[col.key];
      const body = list.length
        ? list.map(item => renderTicket(item, col)).join("")
        : `<div class="col-empty">Nothing here right now</div>`;
      return `
        <div class="column ${col.cls}">
          <div class="col-head">
            <div class="col-head-top">
              <div class="col-label">${col.label}</div>
              <div class="col-count">${list.length}</div>
            </div>
            <div class="col-glow"></div>
            <div class="col-sub">${col.sub}</div>
          </div>
          <div class="ticket-list">${body}</div>
        </div>`;
    }).join("");

    return `<div class="board">${columnsHtml}</div>`;
  }

  async function fetchData() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") {
      document.getElementById("content").innerHTML = `
        <div class="board"><div class="state-error">
          <div class="err-icon">⚙️</div>
          <strong>Apps Script URL not configured</strong>
          <p>Open this HTML file and paste your deployed Apps Script Web App URL into the <code>APPS_SCRIPT_URL</code> variable at the top of the script.</p>
          <div class="config-hint">const APPS_SCRIPT_URL = <span>"https://script.google.com/macros/s/..."</span>;</div>
        </div></div>`;
      return;
    }

    const btn = document.getElementById("refreshBtn");
    btn.classList.add("spinning");

    try {
      const res = await fetch(APPS_SCRIPT_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Unexpected response format");

      allItems = data;
      document.getElementById("content").innerHTML = renderBoard(allItems);
      document.getElementById("syncTime").textContent =
        new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      document.getElementById("footerCount").textContent = allItems.length + " items";

    } catch(err) {
      document.getElementById("content").innerHTML = `
        <div class="board"><div class="state-error">
          <div class="err-icon">⚠️</div>
          <strong>Could not load data</strong>
          <p>${escHtml(err.message)} — Make sure your Apps Script is deployed as a Web App and CORS is enabled.</p>
        </div></div>`;
    } finally {
      btn.classList.remove("spinning");
    }
  }

  // Auto-refresh every 60 seconds
  fetchData();
  setInterval(fetchData, 60000);
</script>
</body>
</html>
