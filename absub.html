<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMRL SUBSTATION DASHBOARD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --transition-speed: 0.3s;
            --radius-s: 8px;
            --radius-m: 16px;
            --radius-l: 24px;
            --radius-full: 999px;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #F0F4F8;
            --surface-color: #FFFFFF;
            --text-primary: #1A202C;
            --text-secondary: #4A5568;
            --accent-primary: #00A651;
            --accent-secondary: #00763C;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --border-color: #E2E8F0;
            --status-online: #48BB78;
            --status-offline: #F56565;
            --pill-bg: #EDF2F7;
        }

        [data-theme="dark"] {
            --bg-color: #0A0F14;
            --surface-color: #141C24;
            --text-primary: #F7FAFC;
            --text-secondary: #A0AEC0;
            --accent-primary: #00D166;
            --accent-secondary: #00A651;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            --border-color: #2D3748;
            --status-online: #48BB78;
            --status-offline: #F56565;
            --pill-bg: #1E293B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- LAYOUT --- */
        .dashboard-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background-color: var(--surface-color);
            padding: 2rem;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-section h1 {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: -1px;
            color: var(--accent-primary);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .header-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- INFO TICKER / SLAB (The Flip Card) --- */
        .info-rotator {
            perspective: 1000px;
            height: 100px;
            width: 100%;
            margin-bottom: 1rem;
        }

        .ir-slab {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ir-slab.flipping-out { transform: rotateX(-90deg); opacity: 0; }
        .ir-slab.flipping-in { transform: rotateX(0deg); opacity: 1; }

        .ir-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--radius-m);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 209, 102, 0.2);
        }

        .ir-title { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; margin-bottom: 0.5rem; opacity: 0.9; }
        .ir-value { font-family: var(--font-display); font-weight: 900; line-height: 1; }
        .ir-label { font-size: 0.9rem; margin-top: 0.5rem; font-weight: 600; }

        .ir-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }
        .ir-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-color); opacity: 0.3; transition: 0.3s; }
        .ir-dot-active { opacity: 1; background: var(--accent-primary); width: 18px; border-radius: var(--radius-full); }

        /* --- DASHBOARD GRID --- */
        .deployment-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius-l);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Deployment Rows */
        .deployment-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .substation-row {
            display: grid;
            grid-template-columns: 140px 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--pill-bg);
            border-radius: var(--radius-m);
        }

        .ss-name { font-weight: 700; font-family: var(--font-display); font-size: 0.9rem; }

        .personnel-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .chip {
            padding: 0.4rem 0.8rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* --- CONSUMABLES PILL (RESIZABLE) --- */
        .consumables-container {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: fit-content;
        }

        .c-pill {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            max-width: 90vw;
        }

        .c-pill.expanded {
            border-radius: var(--radius-l);
            padding: 1.5rem;
            flex-direction: column;
            align-items: stretch;
            width: 400px;
            max-height: 500px; /* Fixed height for expansion */
        }

        .c-pill-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 800;
            font-family: var(--font-display);
            flex-shrink: 0; /* Keep header visible */
        }

        /* This is the key fix for the scrollable items */
        .c-items-list {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
            overflow-y: auto; /* Enable vertical scrolling */
            padding-right: 0.5rem; /* Space for scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) transparent;
        }
        
        .c-items-list::-webkit-scrollbar {
            width: 4px;
        }
        .c-items-list::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }

        .c-pill.expanded .c-items-list {
            display: flex;
        }

        .c-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: var(--pill-bg);
            border-radius: var(--radius-m);
        }

        .c-item-info { display: flex; flex-direction: column; }
        .c-item-name { font-size: 0.85rem; font-weight: 700; }
        .c-item-stock { font-size: 0.75rem; color: var(--accent-primary); font-weight: 800; }

        /* --- MOBILE RE-DESIGN --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .deployment-section { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .main-content { padding: 1rem; }
            
            /* Redesign deployment cards for mobile */
            .substation-row {
                grid-template-columns: 1fr; /* Stack title and chips */
                gap: 0.5rem;
                padding: 1.25rem;
                position: relative;
            }

            .ss-name {
                font-size: 1rem;
                color: var(--accent-primary);
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 0.5rem;
                margin-bottom: 0.25rem;
                display: flex;
                align-items: center;
            }

            .ss-name::before {
                content: 'location_on';
                font-family: 'Material Symbols Rounded';
                margin-right: 6px;
                font-size: 1.1rem;
            }

            /* Make personnel list horizontally scrollable to save vertical space if needed, 
               or just clean multi-line chips. Let's go with a clean grid of chips. */
            .personnel-chips {
                display: grid;
                grid-template-columns: repeat(2, 1fr); /* Two columns of names */
                gap: 0.4rem;
                width: 100%;
            }

            .chip {
                width: 100%;
                text-align: center;
                padding: 0.5rem;
                font-size: 0.8rem;
                background: var(--surface-color);
                border: 1px solid var(--border-color);
            }

            /* Hide the status icon/dot in mobile to reduce clutter or move it */
            .substation-row .material-symbols-rounded {
                position: absolute;
                top: 1.25rem;
                right: 1.25rem;
                font-size: 1rem;
            }

            .c-pill.expanded {
                width: 90vw;
                max-height: 70vh;
            }
        }

        /* --- UTILS --- */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .online { background-color: var(--status-online); box-shadow: 0 0 10px var(--status-online); }
        .offline { background-color: var(--status-offline); }

        /* Animation for flip */
        @keyframes flipIn {
            from { transform: rotateX(-90deg); opacity: 0; }
            to { transform: rotateX(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-section">
                <div style="background: var(--accent-primary); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: white;">
                    <span class="material-symbols-rounded">bolt</span>
                </div>
                <h1>KMRL.OPS</h1>
            </div>

            <nav style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem;">
                <div style="padding: 1rem; background: var(--accent-primary); color: white; border-radius: var(--radius-m); font-weight: 800; display: flex; align-items: center; gap: 10px;">
                    <span class="material-symbols-rounded">dashboard</span> Overview
                </div>
                <div style="padding: 1rem; color: var(--text-secondary); font-weight: 600; display: flex; align-items: center; gap: 10px;">
                    <span class="material-symbols-rounded">inventory_2</span> Inventory
                </div>
                <div style="padding: 1rem; color: var(--text-secondary); font-weight: 600; display: flex; align-items: center; gap: 10px;">
                    <span class="material-symbols-rounded">groups</span> Personnel
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Slab Rotator -->
            <div class="info-rotator">
                <div class="ir-slab" id="slab">
                    <div class="ir-face">
                        <div class="ir-title" id="ir-title">Live Voltage</div>
                        <div class="ir-value" id="ir-value">110.4 kV</div>
                        <div class="ir-label" id="ir-label">ALUVA RSS - FEEDER 01</div>
                    </div>
                </div>
                <div class="ir-dots" id="ir-dots"></div>
            </div>

            <div class="deployment-section">
                <!-- Today -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <span class="material-symbols-rounded" style="color: var(--accent-primary)">event_available</span>
                            Today's Deployment
                        </h2>
                        <span style="font-size: 0.8rem; font-weight: 700; opacity: 0.6;" id="today-date">-- --</span>
                    </div>
                    <div class="deployment-grid" id="today-grid">
                        <!-- JS Render -->
                    </div>
                </div>

                <!-- Tomorrow -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <span class="material-symbols-rounded" style="color: #6366F1">calendar_month</span>
                            Tomorrow
                        </h2>
                        <span style="font-size: 0.8rem; font-weight: 700; opacity: 0.6;" id="tomorrow-date">-- --</span>
                    </div>
                    <div class="deployment-grid" id="tomorrow-grid">
                        <!-- JS Render -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Consumables -->
    <div class="consumables-container">
        <div class="c-pill" id="consumable-pill" onclick="toggleConsumables()">
            <div class="c-pill-header">
                <span class="material-symbols-rounded">package_2</span>
                <span>Substation Consumables</span>
            </div>
            <div class="c-items-list" id="consumable-list">
                <!-- JS Render -->
            </div>
        </div>
    </div>

    <script>
        // Data
        const substations = ["Aluva", "CUSAT", "Kaloor", "Vytilla", "Petta"];
        const personnel = [
            "Rahul K.", "Saritha M.", "Aneesh P.", "Justin T.", 
            "Meera S.", "Vikram R.", "Sanjay D.", "Priya N.",
            "Karthik V.", "Nisha A.", "Deepak L.", "Arjun M."
        ];

        const consumables = [
            { name: "Distilled Water", stock: "45 Liters", icon: "water_drop" },
            { name: "Insulating Tape (Red)", stock: "12 Rolls", icon: "edit_attributes" },
            { name: "Cotton Waste", stock: "15 KG", icon: "texture" },
            { name: "CRC 2-26 Spray", stock: "8 Cans", icon: "cleaning_services" },
            { name: "Nitril Gloves", stock: "24 Pairs", icon: "front_hand" },
            { name: "Fuse Wire (5A)", stock: "10 Spools", icon: "linear_scale" },
            { name: "Terminal Blocks", stock: "150 units", icon: "settings_input_component" },
            { name: "LED Indicators", stock: "30 units", icon: "light" }
        ];

        const irSlides = [
            { title: "Live Load", value: "84.2 MW", label: "System Total Peak", fs: "2.5rem" },
            { title: "Grid Freq", value: "49.98 Hz", label: "Status: Stable", fs: "2.5rem" },
            { title: "Safety Alert", value: "NO LOTO", label: "All clear for works", fs: "2.5rem" },
            { title: "Staff Strength", value: "24/24", label: "Full shift attendance", fs: "2.5rem" }
        ];

        // Render Functions
        function initDates() {
            const now = new Date();
            const tomorrow = new Date();
            tomorrow.setDate(now.getDate() + 1);

            const options = { day: 'numeric', month: 'short' };
            document.getElementById('today-date').textContent = now.toLocaleDateString('en-GB', options).toUpperCase();
            document.getElementById('tomorrow-date').textContent = tomorrow.toLocaleDateString('en-GB', options).toUpperCase();
        }

        function renderDeployments() {
            const todayGrid = document.getElementById('today-grid');
            const tomorrowGrid = document.getElementById('tomorrow-grid');

            substations.forEach((ss, i) => {
                // Today
                const tP = personnel.slice(i, i + 3);
                todayGrid.innerHTML += `
                    <div class="substation-row">
                        <div class="ss-name">${ss.toUpperCase()} RSS</div>
                        <div class="personnel-chips">
                            ${tP.map(p => `<div class="chip">${p}</div>`).join('')}
                        </div>
                        <span class="material-symbols-rounded" style="color: var(--status-online); font-size: 14px;">check_circle</span>
                    </div>
                `;

                // Tomorrow
                const mP = personnel.slice(i + 1, i + 4);
                tomorrowGrid.innerHTML += `
                    <div class="substation-row">
                        <div class="ss-name">${ss.toUpperCase()} RSS</div>
                        <div class="personnel-chips">
                            ${mP.map(p => `<div class="chip">${p}</div>`).join('')}
                        </div>
                        <span class="material-symbols-rounded" style="color: var(--text-secondary); font-size: 14px;">pending</span>
                    </div>
                `;
            });
        }

        function renderConsumables() {
            const list = document.getElementById('consumable-list');
            list.innerHTML = consumables.map(c => `
                <div class="c-item">
                    <div class="c-item-info">
                        <span class="c-item-name">${c.name}</span>
                        <span class="c-item-stock">${c.stock}</span>
                    </div>
                    <span class="material-symbols-rounded" style="opacity: 0.5">${c.icon}</span>
                </div>
            `).join('');
        }

        function toggleConsumables() {
            const pill = document.getElementById('consumable-pill');
            pill.classList.toggle('expanded');
        }

        // Rotator Logic
        let irIdx = 0;
        const IR_INTERVAL = 4000;
        const IR_FLIP_DUR = 300;

        function runRotator() {
            const slab = document.getElementById('slab');
            const title = document.getElementById('ir-title');
            const val = document.getElementById('ir-value');
            const lab = document.getElementById('ir-label');
            const dots = document.getElementById('ir-dots');

            function applySlide() {
                const s = irSlides[irIdx];
                title.textContent = s.title;
                val.textContent = s.value;
                val.style.fontSize = s.fs;
                lab.textContent = s.label;

                dots.innerHTML = irSlides.map((_, i) => 
                    `<div class="ir-dot ${i === irIdx ? 'ir-dot-active' : ''}"></div>`
                ).join('');
            }

            applySlide();

            setInterval(() => {
                slab.classList.add('flipping-out');
                
                setTimeout(() => {
                    irIdx = (irIdx + 1) % irSlides.length;
                    applySlide();
                    slab.classList.remove('flipping-out');
                    slab.classList.add('flipping-in');
                    
                    setTimeout(() => {
                        slab.classList.remove('flipping-in');
                    }, 600);
                }, 300);

            }, IR_INTERVAL);
        }

        // Init
        window.onload = () => {
            initDates();
            renderDeployments();
            renderConsumables();
            runRotator();
        };

    </script>
</body>
</html>
