<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMRL SUBSTATION DASHBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />

    <style>
        /* ================= EXISTING STYLES (UNCHANGED) ================= */
        :root {
            --transition-speed: 0.3s;
            --radius-s: 8px;
            --radius-m: 16px;
            --radius-l: 24px;
            --radius-full: 999px;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #0D1117;
            --surface: #161C25;
            --surface-variant: #1F2836;
            --on-bg: #E2E6EC;
            --on-surface: #E2E6EC;
            --outline: #6E7A8A;
            --primary: #7DBEFF;
            --primary-container: #003D6B;
            --error-container: #7A0009;
            --on-error-container: #FFDAD6;
        }

        body {
            background: var(--bg-color);
            color: var(--on-bg);
            font-family: var(--font-body);
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* ================= DRIVER OUTDATED VISUALS (ADDED) ================= */

        .driver-card.outdated {
            opacity: 0.5;
        }

        .driver-card.outdated .driver-pill {
            position: relative;
        }

        .driver-card.outdated .driver-pill::after {
            content: 'OUTDATED';
            position: absolute;
            top: -6px;
            right: 8px;
            padding: 2px 8px;
            font-family: var(--font-display);
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 1px;
            border-radius: var(--radius-full);
            background: var(--error-container);
            color: var(--on-error-container);
            box-shadow: 0 0 10px rgba(186,26,26,0.6);
            animation: warn-pulse 2s infinite;
        }

        @keyframes warn-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.5); }
            100% { box-shadow: 0 0 0 10px rgba(255,0,0,0); }
        }
    </style>
</head>

<body>

    <!-- ================= EXISTING BODY CONTENT (UNCHANGED) ================= -->
    <!-- app bar, ticker, dashboard, driver card, etc. -->
    <!-- assumes driver card has id="driver-card" and class="driver-card" -->

    <!-- ================= DRIVER UPDATE ANIMATION (ADDED) ================= -->
    <script>
        const driverCard = document.getElementById('driver-card');

        const car = document.createElement('div');
        car.innerHTML = '<span class="material-symbols-rounded">directions_car</span>';
        Object.assign(car.style, {
            position: 'fixed',
            right: '-90px',
            bottom: '52px',
            fontSize: '30px',
            zIndex: 5000,
            opacity: '0',
            pointerEvents: 'none',
            transition: 'transform 1.6s cubic-bezier(0.4,0,0.2,1), opacity 0.3s'
        });
        document.body.appendChild(car);

        let wasOutdated = driverCard?.classList.contains('outdated');

        function playDriverUpdateAnimation() {
            const r = driverCard.getBoundingClientRect();
            car.style.opacity = '1';
            car.style.transform =
                `translate(${r.left - window.innerWidth + 28}px,
                           ${r.top - window.innerHeight + 28}px)`;

            setTimeout(() => {
                car.style.opacity = '0';
                car.style.transform = 'none';
            }, 1700);
        }

        new MutationObserver(() => {
            const isOutdated = driverCard.classList.contains('outdated');
            if (wasOutdated && !isOutdated) {
                playDriverUpdateAnimation();
            }
            wasOutdated = isOutdated;
        }).observe(driverCard, { attributes: true, attributeFilter: ['class'] });
    </script>

</body>
</html>
