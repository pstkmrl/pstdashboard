<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMRL SUBSTATION DASHBOARD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --transition-speed: 0.3s;
            --radius-s: 8px;
            --radius-m: 16px;
            --radius-l: 24px;
            --radius-full: 999px;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #F0F4F8;
            --surface: #FFFFFF;
            --surface-variant: #E4EBF2;
            --surface-dim: #D8E2EE;
            --on-bg: #1A1C1E;
            --on-surface: #1A1C1E;
            --on-surface-variant: #44474F;
            --outline: #74777F;
            --primary: #0061A4;
            --primary-container: #D1E4FF;
            --on-primary-container: #001D36;
            --secondary: #535F70;
            --secondary-container: #D7E3F7;
            --error: #BA1A1A;
            --error-container: #FFDAD6;
            --on-error-container: #410002;
            --success: #146C2E;
            --success-container: #C4EED0;
            --on-success-container: #002107;
            --warning: #7D5260;
            --warning-container: #FFD8E4;
            --on-warning-container: #31111D;
            --shadow-1: 0 2px 4px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.06);
            --shadow-2: 0 4px 8px rgba(0,0,0,0.1), 0 8px 24px rgba(0,0,0,0.1);
            --tech-bg: rgba(0, 97, 164, 0.06);
            --tech-border: rgba(0, 97, 164, 0.2);
            --tech-name-color: #003D6B;
        }

        [data-theme="dark"] {
            --bg-color: #0D1117;
            --surface: #161C25;
            --surface-variant: #1F2836;
            --surface-dim: #131920;
            --on-bg: #E2E6EC;
            --on-surface: #E2E6EC;
            --on-surface-variant: #B8C4D4;
            --outline: #6E7A8A;
            --primary: #7DBEFF;
            --primary-container: #003D6B;
            --on-primary-container: #D1E4FF;
            --secondary: #A8BDD4;
            --secondary-container: #2C3D52;
            --error: #FFB4AB;
            --error-container: #7A0009;
            --on-error-container: #FFDAD6;
            --success: #72D48A;
            --success-container: #003D17;
            --on-success-container: #C4EED0;
            --warning: #FFB1C8;
            --warning-container: #4A2234;
            --on-warning-container: #FFD8E4;
            --shadow-1: 0 2px 4px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.3);
            --shadow-2: 0 4px 8px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.6);
            --tech-bg: rgba(125, 190, 255, 0.07);
            --tech-border: rgba(125, 190, 255, 0.18);
            --tech-name-color: #9ECAFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-color);
            color: var(--on-bg);
            font-family: var(--font-body);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        /* ── APP BAR ── */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            padding: 10px 20px;
            margin: 10px 10px 0 10px;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-1);
            z-index: 100;
            flex-shrink: 0;
        }
        .logo-section img { height: 34px; object-fit: contain; }
        .middle-module {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 0 20px;
            height: 44px;
            overflow: hidden;
        }
        .checklist-container {
            flex: 1; min-width: 0; height: 100%;
            background: var(--secondary-container); color: var(--on-surface);
            border-radius: var(--radius-full);
            display: flex; align-items: center; position: relative; overflow: hidden;
        }
        /* Fade edges */
        .checklist-container::before,
        .checklist-container::after {
            content: ''; position: absolute; top: 0; width: 40px; height: 100%; z-index: 2; pointer-events: none;
        }
        .checklist-container::before { left: 0; background: linear-gradient(to right, var(--secondary-container), transparent); }
        .checklist-container::after  { right: 0; background: linear-gradient(to left, var(--secondary-container), transparent); }
        .clock-container { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .clock-unit {
            background: var(--surface-variant); color: var(--on-surface);
            border-radius: var(--radius-m); padding: 3px 10px;
            display: flex; flex-direction: column; align-items: center; min-width: 54px;
        }
        .clock-val { font-family: var(--font-display); font-size: 1.4rem; font-weight: 900; line-height: 1.1; }
        .clock-label { font-size: 0.55rem; font-weight: 700; color: var(--on-surface-variant); letter-spacing: 1.2px; }
        .top-controls { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--surface-variant); color: var(--on-surface);
            border: none; width: 40px; height: 40px;
            border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .icon-btn:hover { background: var(--secondary-container); transform: scale(1.05); }
        .btn-grid-active { background: var(--primary); color: var(--surface); }
        .btn-off { background: var(--error-container); color: var(--on-error-container); }

        /* ── STATION TEMP TRACK (lives inside checklist-container) ── */
        .station-track {
            display: flex; gap: 16px; width: max-content;
            align-items: center; padding: 0 16px;
            position: absolute;
            top: 0; left: 0; height: 100%;
            animation: stock-scroll 45s linear infinite;
        }
        .station-track:hover { animation-play-state: paused; }
        @keyframes stock-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .stock-item {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--outline);
            padding: 3px 14px 3px 10px;
            border-radius: var(--radius-full);
            font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; white-space: nowrap;
        }
        [data-theme="light"] .stock-item { background: rgba(0,0,0,0.04); }
        .stock-item.alarm { background: var(--error-container); color: var(--on-error-container); border-color: var(--error); animation: pulse-alarm 1.5s infinite alternate; }
        @keyframes pulse-alarm {
            0% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); }
            100% { box-shadow: 0 0 0 8px rgba(255,0,0,0); }
        }
        .stock-name { color: var(--primary); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.8px; font-weight: 900; margin-right: 2px; }
        .stock-val { display: inline-flex; align-items: center; gap: 3px; }
        .stock-val.safe { color: var(--success); }
        .stock-val.warn { color: var(--error); }
        .stock-icon { font-size: 0.9rem !important; opacity: 0.75; }
        .stock-divider { width: 1px; height: 18px; background: var(--outline); opacity: 0.4; flex-shrink: 0; }

        /* ── DASHBOARD LAYOUT ── */
        .dashboard-content {
            display: grid;
            grid-template-columns: 5fr 3fr;
            gap: 10px;
            padding: 10px 10px 150px 10px;
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--surface-variant) transparent;
        }
        .left-column { display: flex; flex-direction: column; gap: 10px; height: max-content; }
        .right-column { display: flex; flex-direction: column; gap: 10px; height: max-content; }

        /* ── M3 CARD ── */
        .m3-card {
            background: var(--surface); border-radius: var(--radius-l);
            padding: 16px; box-shadow: var(--shadow-1);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ── DEPLOYMENT CARD HEADER with inline general info ── */
        .deploy-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .card-header {
            font-family: var(--font-display);
            font-weight: 900; font-size: 1rem;
            color: var(--primary);
            display: flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 0.8px;
            flex-shrink: 0;
        }
        .general-info-pill {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
        }
        .gen-name-tag {
            background: var(--surface-variant);
            color: var(--on-surface);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.78rem;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            white-space: nowrap;
            border: 1.5px solid var(--outline);
            letter-spacing: 0.3px;
        }
        .gen-label-pill {
            background: var(--secondary-container);
            color: var(--on-surface-variant);
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ── ROSTER GRID ── */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            align-items: stretch;
        }

        /* ── SHIFT CARD ── */
        .m3-shift-card {
            background: var(--surface-variant);
            border-radius: var(--radius-m);
            padding: 12px;
            display: flex; flex-direction: column; gap: 0;
            border: 2px solid transparent;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            overflow: hidden;
        }
        /* Tech section always at bottom */
        .m3-shift-card .tech-section {
            margin-top: auto;
            padding-top: 8px;
        }
        .m3-shift-active {
            border-color: var(--success);
            box-shadow: 0 0 0 1px var(--success-container), 0 4px 16px rgba(114, 212, 138, 0.15);
        }

        .shift-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .m3-shift-label {
            font-family: var(--font-display);
            font-weight: 900; font-size: 1rem;
            color: var(--on-surface);
            letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
        }
        .shift-count-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: var(--surface-dim);
            border: 1px solid var(--outline);
            border-radius: var(--radius-full);
            padding: 2px 9px 2px 7px;
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--on-surface-variant);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .shift-count-badge .cnt-staff {
            color: var(--on-surface);
            font-weight: 900;
        }
        .shift-count-badge .cnt-sep {
            opacity: 0.4;
            margin: 0 1px;
            font-size: 0.75rem;
        }
        .shift-count-badge .cnt-tech {
            color: var(--primary);
            font-weight: 900;
        }
        .shift-count-badge .material-symbols-rounded {
            font-size: 14px !important;
            opacity: 0.55;
        }
        .shift-active-dot {
            width: 8px; height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: none;
            animation: pulse-dot 2s infinite;
        }
        .m3-shift-active .shift-active-dot { display: inline-block; }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.7; }
        }

        .shift-tpc-badge {
            font-size: 0.62rem;
            background: var(--primary-container);
            color: var(--on-primary-container);
            padding: 2px 8px; border-radius: var(--radius-full);
            font-weight: 800; letter-spacing: 0.5px; white-space: nowrap;
        }

        /* ── STAFF LIST — compact 2-col grid ── */
        .staff-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }
        .m3-staff-item {
            display: flex; align-items: center; gap: 6px;
            background: var(--surface); padding: 5px 8px;
            border-radius: var(--radius-s);
            min-width: 0; overflow: hidden;
        }
        .staff-name {
            font-family: var(--font-display);
            font-size: 1.125rem; font-weight: 800;
            color: var(--on-surface);
            letter-spacing: 0.2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; min-width: 0;
        }
        .m3-badge { font-size: 0.58rem; padding: 2px 6px; border-radius: var(--radius-full); font-weight: 800; flex-shrink: 0; white-space: nowrap; }
        .badge-tpc-m { background: #00E5FF; color: #000; }
        .badge-tpc-e { background: #FF9100; color: #000; }
        .badge-tpc-n { background: #D500F9; color: #FFF; }
        .badge-default { background: var(--outline); color: var(--surface); }

        /* ── TECHNICIAN SECTION (inside shift card) ── */
        .tech-section {
            border-top: 1.5px solid var(--tech-border);
            padding-top: 8px;
        }
        .tech-label-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .tech-label {
            font-family: var(--font-display);
            font-size: 0.6rem; font-weight: 900;
            color: var(--primary);
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .tech-label-icon {
            font-size: 13px !important;
            color: var(--primary);
        }

        /* Infinite scroll marquee for technicians */
        .tech-scroll-wrap {
            overflow: hidden;
            border-radius: var(--radius-s);
            background: var(--tech-bg);
            border: 1px solid var(--tech-border);
            padding: 5px 0;
            position: relative;
        }
        .tech-scroll-track {
            display: flex;
            gap: 0;
            width: max-content;
            animation: tech-scroll 18s linear infinite;
        }
        .tech-scroll-track:hover { animation-play-state: paused; }
        @keyframes tech-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .tech-name-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 14px;
            font-family: var(--font-display);
            font-size: 1.025rem;
            font-weight: 800;
            color: var(--tech-name-color);
            white-space: nowrap;
            border-right: 1.5px solid var(--tech-border);
        }
        .tech-name-chip:last-child { border-right: none; }
        .tech-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.6;
            flex-shrink: 0;
        }
        /* Static display for few names */
        .tech-static { 
            display: flex; flex-wrap: wrap; gap: 4px;
            padding: 2px 0;
        }
        .tech-static .tech-name-chip {
            background: var(--tech-bg);
            border: 1px solid var(--tech-border);
            border-radius: var(--radius-full);
            padding: 3px 10px;
        }

        /* ── CHECKLIST STATUS CARD ── */
        .checklist-status-card {
            border-radius: var(--radius-m);
            padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            border: 1.5px solid transparent;
            transition: all 0.4s ease;
            flex-shrink: 0;
        }
        .chk-icon-wrap {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .chk-icon-wrap .material-symbols-rounded { font-size: 20px; }
        .chk-label {
            font-family: var(--font-display); font-size: 0.58rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.7;
            line-height: 1;
        }
        .chk-status-text {
            font-family: var(--font-display); font-size: 0.88rem; font-weight: 900;
            line-height: 1.2; letter-spacing: 0.3px;
        }
        /* Fully filled */
        .chk-filled {
            background: var(--success-container);
            border-color: var(--success);
        }
        .chk-filled .chk-icon-wrap { background: var(--success); color: var(--on-success-container); }
        .chk-filled .chk-label { color: var(--on-success-container); }
        .chk-filled .chk-status-text { color: var(--on-success-container); }
        /* Partially filled */
        .chk-partial {
            background: var(--warning-container);
            border-color: var(--warning);
        }
        .chk-partial .chk-icon-wrap { background: var(--warning); color: var(--surface); }
        .chk-partial .chk-label { color: var(--on-warning-container); }
        .chk-partial .chk-status-text { color: var(--on-warning-container); }
        /* Not filled */
        .chk-empty {
            background: var(--warning-container);
            border-color: var(--warning);
        }
        .chk-empty .chk-icon-wrap { background: var(--warning); color: var(--surface); }
        .chk-empty .chk-label { color: var(--on-warning-container); }
        .chk-empty .chk-status-text { color: var(--on-warning-container); }

        /* ── RIGHT COLUMN: Maintenance ── */
        .unified-unit { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .maint-header-wrapper { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ops-inline-container { display: flex; gap: 6px; flex-wrap: wrap; }
        .ops-badge {
            font-family: var(--font-display); font-weight: 800; font-size: 0.8rem;
            padding: 4px 12px; border-radius: var(--radius-full);
            box-shadow: var(--shadow-1); text-align: center;
        }
        .ops-badge.alert { background: var(--error-container); color: var(--on-error-container); border: 1px solid var(--error); }
        .ops-badge.ok { background: var(--success-container); color: var(--on-success-container); border: 1px solid var(--success); }
        .maint-divider { height: 1.5px; background: var(--surface-variant); margin: 4px 0; border-radius: var(--radius-full); }
        .maint-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .m3-sch-item {
            background: var(--surface-variant); color: var(--on-surface);
            padding: 10px 14px; border-radius: var(--radius-m);
            font-size: 0.85rem; font-weight: 600;
            border-left: 5px solid var(--warning);
            line-height: 1.5;
        }

        /* ── DRIVER CARD — Liquid Glass Pill ── */
        .driver-card {
            position: fixed; bottom: 54px; left: 10px;
            z-index: 1000;
            cursor: pointer;
            transition: all 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Collapsed pill */
        .driver-pill {
            display: flex; align-items: center; gap: 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: var(--radius-full);
            box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2),
                        inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.12);
            backdrop-filter: blur(28px) saturate(1.8);
            -webkit-backdrop-filter: blur(28px) saturate(1.8);
            padding: 6px 14px 6px 8px;
            gap: 8px;
            max-width: 240px;
            overflow: hidden;
            transition: all 0.38s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            opacity: 1;
        }
        [data-theme="light"] .driver-pill {
            background: rgba(255,255,255,0.55);
            border-color: rgba(255,255,255,0.75);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.07),
                        inset 0 1px 0 rgba(255,255,255,0.9);
        }
        .driver-card.outdated .driver-pill {
            opacity: 0.5;
            border-color: rgba(255,100,80,0.55);
            box-shadow: 0 8px 32px rgba(186,26,26,0.3), 0 2px 8px rgba(0,0,0,0.2),
                        inset 0 1px 0 rgba(255,180,171,0.2);
        }

        .driver-pill-icon {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            background: rgba(125,190,255,0.15);
            border: 1.5px solid rgba(125,190,255,0.35);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            font-size: 17px;
        }
        .driver-card.outdated .driver-pill-icon {
            background: rgba(255,100,80,0.12);
            border-color: rgba(255,100,80,0.35);
            color: var(--error);
        }

        /* Sliding text: name → number alternating */
        .driver-pill-text-wrap {
            overflow: hidden;
            height: 1.25rem;
            display: flex; flex-direction: column;
            position: relative;
        }
        .driver-pill-slide {
            display: flex; flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.6s ease;
        }
        .driver-pill-slide.show-number { transform: translateY(-50%); }
        .driver-pill-name-val {
            font-family: var(--font-display);
            font-weight: 800; font-size: 0.88rem;
            color: var(--on-surface);
            white-space: nowrap; line-height: 1.25rem;
            letter-spacing: 0.2px;
        }
        .driver-pill-num-val {
            font-family: var(--font-display);
            font-weight: 700; font-size: 0.82rem;
            color: var(--primary);
            white-space: nowrap; line-height: 1.25rem;
            letter-spacing: 0.5px;
        }
        .driver-card.outdated .driver-pill-num-val { color: var(--error); }

        /* Outdated badge on pill — NOW VISIBLE */
        .driver-pill-outdated-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--error);
            box-shadow: 0 0 6px var(--error);
            flex-shrink: 0;
            display: none;
            animation: warn-pulse 2s infinite;
        }
        .driver-card.outdated .driver-pill-outdated-dot { display: block; }

        @keyframes warning-blink { from { opacity: 1; } to { opacity: 0.7; } }
        @keyframes warn-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        /* ── CAR ANIMATION ── */
        .driver-car-animation {
            position: fixed;
            z-index: 1001;
            font-size: 28px;
            pointer-events: none;
            bottom: 120px;
            right: calc(100vw - 40px);
            opacity: 0;
            animation: car-drive 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes car-drive {
            0% {
                right: calc(100vw - 40px);
                bottom: 120px;
                opacity: 1;
                transform: scaleX(1);
            }
            50% {
                bottom: 80px;
                opacity: 1;
            }
            100% {
                right: 60px;
                bottom: 54px;
                opacity: 0;
                transform: scaleX(1);
            }
        }

        /* Expanded panel — pops out above the pill */
        .driver-expanded {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            min-width: 220px;
            background: rgba(22,28,37,0.82);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: var(--radius-l);
            box-shadow: 0 16px 48px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3),
                        inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(32px) saturate(2);
            -webkit-backdrop-filter: blur(32px) saturate(2);
            padding: 14px 16px;
            display: flex; flex-direction: column; gap: 10px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            transform-origin: bottom left;
            transition: opacity 0.28s cubic-bezier(0.4,0,0.2,1),
                        transform 0.28s cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="light"] .driver-expanded {
            background: rgba(255,255,255,0.82);
            border-color: rgba(255,255,255,0.85);
            box-shadow: 0 16px 48px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.1),
                        inset 0 1px 0 rgba(255,255,255,0.95);
        }
        .driver-card.expanded .driver-expanded {
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .driver-card.outdated .driver-expanded {
            border-color: rgba(255,100,80,0.4);
        }

        /* Outdated banner inside expanded */
        .driver-exp-outdated {
            display: none;
            align-items: center; gap: 6px;
            background: rgba(186,26,26,0.18);
            border: 1px solid rgba(255,100,80,0.35);
            border-radius: var(--radius-s);
            padding: 5px 10px;
            font-family: var(--font-display); font-size: 0.6rem; font-weight: 900;
            letter-spacing: 1px; text-transform: uppercase;
            color: var(--error);
            animation: warning-blink 1.5s infinite alternate;
        }
        .driver-card.outdated .driver-exp-outdated { display: flex; }

        .driver-exp-header {
            display: flex; flex-direction: column; gap: 2px;
        }
        .driver-exp-label {
            font-size: 0.52rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1.2px; color: var(--on-surface-variant); opacity: 0.6;
        }
        .driver-exp-shift {
            font-size: 0.6rem; font-weight: 800; color: var(--primary);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .driver-exp-name {
            font-family: var(--font-display); font-weight: 900; font-size: 1.05rem;
            color: var(--on-surface); letter-spacing: 0.2px; line-height: 1.2;
        }
        [data-theme="light"] .driver-exp-name { color: var(--on-surface); }
        .driver-exp-phone {
            font-size: 0.78rem; font-weight: 600; color: var(--on-surface-variant);
            letter-spacing: 0.3px;
        }
        .driver-exp-update {
            font-size: 0.56rem; font-weight: 700; color: var(--outline);
            letter-spacing: 0.4px;
            padding-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        [data-theme="light"] .driver-exp-update { border-color: rgba(0,0,0,0.08); }
        .driver-exp-call {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(114,212,138,0.15);
            border: 1.5px solid rgba(114,212,138,0.4);
            border-radius: var(--radius-full);
            padding: 8px 14px;
            font-family: var(--font-display); font-weight: 900; font-size: 0.78rem;
            letter-spacing: 0.8px; text-transform: uppercase;
            color: var(--success);
            cursor: pointer; transition: all 0.2s ease;
        }
        .driver-exp-call:hover {
            background: rgba(114,212,138,0.25);
            transform: scale(1.02);
        }
        .driver-exp-call .material-symbols-rounded { font-size: 18px !important; }

        /* keep these for badge-active / badge-outdated used in evaluateUpdateBadge */
        .badge-active { background: var(--success-container); color: var(--on-success-container); }
        .badge-outdated { background: var(--error-container); color: var(--on-error-container); }

        /* ── FLASH NEWS OVERLAY ── */
        #flash-news-overlay {
            position: fixed; inset: 0; z-index: 9990;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #flash-news-overlay.visible { opacity: 1; pointer-events: auto; }
        .flash-backdrop {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(6px) saturate(0.6);
            -webkit-backdrop-filter: blur(6px) saturate(0.6);
        }
        .flash-panel {
            position: relative; z-index: 1;
            width: min(820px, calc(100vw - 32px));
            background: rgba(10,14,20,0.88);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-l);
            box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 8px 24px rgba(0,0,0,0.4),
                        inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(40px) saturate(2);
            -webkit-backdrop-filter: blur(40px) saturate(2);
            overflow: hidden;
            transform: scale(0.93) translateY(20px);
            transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
        }
        [data-theme="light"] .flash-panel {
            background: rgba(240,244,248,0.9);
            border-color: rgba(255,255,255,0.8);
        }
        #flash-news-overlay.visible .flash-panel {
            transform: scale(1) translateY(0);
        }
        .flash-banner {
            display: flex; align-items: center; gap: 10px;
            background: #CC0000;
            padding: 7px 20px;
        }
        .flash-banner-live {
            display: flex; align-items: center; gap: 5px;
            background: #fff;
            border-radius: 3px; padding: 1px 8px;
            font-family: var(--font-display); font-size: 0.72rem; font-weight: 900;
            color: #CC0000; letter-spacing: 1.5px;
            animation: flash-live-blink 1s infinite;
        }
        .flash-live-dot { width: 7px; height: 7px; border-radius: 50%; background: #CC0000; }
        @keyframes flash-live-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .flash-banner-text {
            font-family: var(--font-display); font-size: 0.72rem; font-weight: 900;
            letter-spacing: 2px; color: #fff; text-transform: uppercase;
        }
        .flash-banner-tag {
            margin-left: auto;
            font-family: var(--font-display); font-size: 0.6rem; font-weight: 800;
            letter-spacing: 1.5px; color: rgba(255,255,255,0.7);
        }
        .flash-body {
            padding: 28px 28px 24px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .flash-eyebrow {
            font-family: var(--font-display); font-size: 0.6rem; font-weight: 900;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: #CC0000;
            display: flex; align-items: center; gap: 6px;
        }
        .flash-eyebrow::before {
            content: '';
            display: block; width: 20px; height: 2px; background: #CC0000;
        }
        .flash-headline {
            font-family: var(--font-display); font-weight: 900;
            font-size: clamp(1.4rem, 4vw, 2.1rem);
            line-height: 1.25; letter-spacing: -0.3px;
            color: var(--on-bg);
        }
        [data-theme="light"] .flash-headline { color: var(--on-bg); }
        .flash-item-num {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.6rem; font-weight: 800;
            color: var(--on-surface-variant); opacity: 0.5; letter-spacing: 1px;
        }
        .flash-dots { display: flex; gap: 5px; }
        .flash-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.2); transition: background 0.3s;
        }
        [data-theme="light"] .flash-dot { background: rgba(0,0,0,0.15); }
        .flash-dot.active { background: #CC0000; }
        .flash-footer {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 12px 28px;
        }
        [data-theme="light"] .flash-footer { border-color: rgba(0,0,0,0.08); }
        .flash-progress-wrap {
            flex: 1; height: 2px; background: rgba(255,255,255,0.1);
            border-radius: var(--radius-full); overflow: hidden; margin-right: 16px;
        }
        [data-theme="light"] .flash-progress-wrap { background: rgba(0,0,0,0.1); }
        .flash-progress-fill {
            height: 100%; background: #CC0000;
            border-radius: var(--radius-full);
            transition: width 0.1s linear;
            width: 0%;
        }
        .flash-dismiss {
            font-family: var(--font-display); font-size: 0.6rem; font-weight: 900;
            letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--on-surface-variant); opacity: 0.5;
            cursor: pointer; transition: opacity 0.2s;
            white-space: nowrap;
        }
        .flash-dismiss:hover { opacity: 1; }

        /* ── APP DOCK — Liquid Glass ── */
        .app-dock {
            position: fixed;
            bottom: 54px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            /* liquid glass */
            background: rgba(255,255,255,0.08);
            border-radius: var(--radius-full);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.35),
                0 2px 8px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.22),
                inset 0 -1px 0 rgba(0,0,0,0.12);
            backdrop-filter: blur(28px) saturate(1.8);
            -webkit-backdrop-filter: blur(28px) saturate(1.8);
            max-width: calc(100vw - 40px);
            flex-wrap: nowrap;
            overflow: hidden;
            transition: all 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="light"] .app-dock {
            background: rgba(255,255,255,0.55);
            border-color: rgba(255,255,255,0.7);
            box-shadow:
                0 8px 32px rgba(0,0,0,0.12),
                0 2px 8px rgba(0,0,0,0.08),
                inset 0 1px 0 rgba(255,255,255,0.9),
                inset 0 -1px 0 rgba(0,0,0,0.06);
        }
        .app-dock:empty { display: none; }

        /* Dock scroll container for items */
        .dock-items-scroll {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            flex-shrink: 1;
            min-width: 0;
        }
        /* Infinite scroll track (when collapsed & overflowing) */
        .dock-items-scroll.scrolling {
            overflow: visible;
        }
        .dock-scroll-track {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .dock-scroll-track.animated {
            animation: dock-ticker 20s linear infinite;
        }
        .dock-scroll-track.animated:hover { animation-play-state: paused; }
        @keyframes dock-ticker {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Expand/collapse button within dock */
        .dock-expand-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--on-surface);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }
        [data-theme="light"] .dock-expand-btn {
            background: rgba(0,0,0,0.06);
            border-color: rgba(0,0,0,0.12);
        }
        .dock-expand-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.08); }
        .dock-expand-btn .material-symbols-rounded { font-size: 18px !important; transition: transform 0.3s ease; }
        .dock-expand-btn.expanded .material-symbols-rounded { transform: rotate(180deg); }
        .dock-expand-btn.visible { display: flex; }

        /* When dock is expanded: wrap items */
        .app-dock.dock-expanded {
            border-radius: var(--radius-l);
            max-width: calc(100vw - 40px);
        }
        .app-dock.dock-expanded .dock-items-scroll {
            flex-wrap: wrap;
            overflow: visible;
            justify-content: center;
        }
        .app-dock.dock-expanded .dock-scroll-track {
            flex-wrap: wrap;
            animation: none !important;
            justify-content: center;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: default;
            transition: transform 0.2s ease;
            flex-shrink: 0;
            position: relative;
        }
        .dock-item:hover { transform: translateY(-4px) scale(1.1); }

        .dock-icon-ring {
            position: relative;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }
        .dock-icon-ring svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }
        .dock-icon-ring svg .ring-track {
            fill: none;
            stroke: rgba(255,255,255,0.1);
            stroke-width: 3;
        }
        [data-theme="light"] .dock-icon-ring svg .ring-track {
            stroke: rgba(0,0,0,0.1);
        }
        .dock-icon-ring svg .ring-fill {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                        stroke 0.4s ease;
        }
        /* Glass circle icon container — matches ring shape */
        .dock-img-wrap {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 38px; height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.22);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(6px);
        }
        [data-theme="light"] .dock-img-wrap {
            background: rgba(255,255,255,0.6);
            border-color: rgba(255,255,255,0.8);
        }
        .dock-img { width: 100%; height: 100%; object-fit: cover; }
        .dock-label {
            font-family: var(--font-display);
            font-size: 0.52rem; font-weight: 900;
            letter-spacing: 0.8px; text-transform: uppercase;
            color: var(--on-surface-variant); opacity: 0.6;
        }
    </style>
</head>
<body>
    <!-- Notice Bar with space for car animation -->
    <div class="app-bar">
        <div class="logo-section"><img alt="logo"></div>
        <div class="middle-module">
            <div class="checklist-container">
                <div class="station-track" id="stationTrack"></div>
            </div>
            <div class="clock-container">
                <div class="clock-unit">
                    <div class="clock-val" id="hoursDisplay">00</div>
                    <div class="clock-label">HOURS</div>
                </div>
                <div class="clock-unit">
                    <div class="clock-val" id="minutesDisplay">00</div>
                    <div class="clock-label">MINS</div>
                </div>
                <div class="clock-unit">
                    <div class="clock-val" id="secondsDisplay">00</div>
                    <div class="clock-label">SECS</div>
                </div>
            </div>
        </div>
        <div class="top-controls">
            <button class="icon-btn" id="gridBtn" title="Grid">
                <span class="material-symbols-rounded">grid_3x3</span>
            </button>
            <button class="icon-btn" id="offBtn" title="Off">
                <span class="material-symbols-rounded">power_settings_new</span>
            </button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard-content">
        <!-- LEFT COLUMN -->
        <div class="left-column" id="leftColumn"></div>

        <!-- RIGHT COLUMN -->
        <div class="right-column" id="rightColumn"></div>
    </div>

    <!-- Driver Card — Liquid Glass Pill -->
    <div class="driver-card" id="driverCard">
        <div class="driver-pill">
            <div class="driver-pill-icon">
                <span class="material-symbols-rounded">directions_car</span>
            </div>
            <div class="driver-pill-text-wrap">
                <div class="driver-pill-slide">
                    <div class="driver-pill-name-val" id="driverPillName">DRIVER NAME</div>
                    <div class="driver-pill-num-val" id="driverPillNum">000</div>
                </div>
            </div>
            <div class="driver-pill-outdated-dot" id="driverPillDot"></div>
        </div>
        <div class="driver-expanded">
            <div class="driver-exp-outdated" id="driverExpOutdated">
                <span class="material-symbols-rounded">warning</span>
                <span>OUTDATED</span>
            </div>
            <div class="driver-exp-header">
                <div class="driver-exp-label">Current Driver</div>
                <div class="driver-exp-shift" id="driverExpShift">SHIFT</div>
            </div>
            <div class="driver-exp-name" id="driverExpName">Driver Name</div>
            <div class="driver-exp-phone" id="driverExpPhone">+91 99999 00000</div>
            <div class="driver-exp-update" id="driverExpUpdate">Updated 2 mins ago</div>
            <button class="driver-exp-call" id="driverExpCall">
                <span class="material-symbols-rounded">call</span>
                <span>CALL NOW</span>
            </button>
        </div>
    </div>

    <!-- App Dock -->
    <div class="app-dock" id="appDock">
        <div class="dock-items-scroll" id="dockItemsScroll">
            <div class="dock-scroll-track" id="dockScrollTrack"></div>
        </div>
        <button class="dock-expand-btn" id="dockExpandBtn">
            <span class="material-symbols-rounded">expand_more</span>
        </button>
    </div>

    <!-- Flash News Overlay -->
    <div id="flash-news-overlay">
        <div class="flash-backdrop"></div>
        <div class="flash-panel">
            <div class="flash-banner">
                <div class="flash-banner-live">
                    <div class="flash-live-dot"></div>
                    <span>LIVE</span>
                </div>
                <div class="flash-banner-text" id="flashBannerText">ALERT</div>
                <div class="flash-banner-tag" id="flashBannerTag">NEW</div>
            </div>
            <div class="flash-body">
                <div class="flash-eyebrow" id="flashEyebrow">ALERT</div>
                <div class="flash-headline" id="flashHeadline">Message</div>
                <div class="flash-item-num">
                    <span id="flashItemNum">1 of 1</span>
                    <div class="flash-dots" id="flashDots"></div>
                </div>
            </div>
            <div class="flash-footer">
                <div class="flash-progress-wrap">
                    <div class="flash-progress-fill" id="flashProgressFill"></div>
                </div>
                <div class="flash-dismiss" id="flashDismiss">DISMISS</div>
            </div>
        </div>
    </div>

    <script>
        // ===== DRIVER CAR ANIMATION & PILL OPACITY UPDATE =====
        function playCarAnimation() {
            const car = document.createElement('div');
            car.className = 'driver-car-animation';
            car.textContent = '🚗';
            document.body.appendChild(car);
            
            // Remove after animation completes
            setTimeout(() => car.remove(), 2800);
        }

        function updateDriverStatus(isOutdated) {
            const driverCard = document.getElementById('driverCard');
            
            if (isOutdated) {
                driverCard.classList.add('outdated');
            } else {
                driverCard.classList.remove('outdated');
            }
            
            // Play the car animation when status changes
            playCarAnimation();
        }

        // Example: Toggle outdated status (remove this in production, replace with actual data)
        document.getElementById('driverCard').addEventListener('click', function(e) {
            if (!this.classList.contains('expanded')) {
                this.classList.add('expanded');
            } else if (e.target.closest('.driver-pill')) {
                this.classList.remove('expanded');
                const isOutdated = this.classList.contains('outdated');
                updateDriverStatus(!isOutdated);
            }
        });

        // Close expanded on outside click
        document.addEventListener('click', function(e) {
            const driverCard = document.getElementById('driverCard');
            if (driverCard.classList.contains('expanded') && !driverCard.contains(e.target)) {
                driverCard.classList.remove('expanded');
            }
        });
    </script>
</body>
</html>
